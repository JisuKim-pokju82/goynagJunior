        <div class="p-2.5 rounded-2xl bg-[#0E1017]/80 border border-[#282D3D] flex items-center justify-between gap-2 shadow-sm">

            </span>
            <span class="text-xs text-zinc-200 font-medium truncate">
              ${c.text}
            </span>
          </div>
          <span class="text-[9px] text-zinc-500 font-semibold shrink-0">
            ${c.time || '諛⑷툑 ??}
          </span>
        </div>
      `).join('');
    }

    function submitCheerComment(event) {
      event.preventDefault();
      const authorInput = document.getElementById('cheerAuthor');
      const textInput = document.getElementById('cheerText');
      const author = authorInput.value.trim();
      const text = textInput.value.trim();
      if (!author || !text) return;

      const comments = getStoredComments();
      comments.unshift({
        author: author,
        text: text,
        time: '諛⑷툑 ??
      });
      saveComments(comments);
      renderCheerComments();

      authorInput.value = '';
      textInput.value = '';

      if (window.confetti) {
        confetti({
          particleCount: 30,
          spread: 60,
          origin: { y: 0.85 },
          colors: ['#FFD200', '#EF4444', '#10B981']
        });
      }
      showToast('?뚯쨷???묒썝 硫붿떆吏媛 ?깅줉?섏뿀?듬땲?? ?쏜윊?);
    }

    // Initialize comments on load
    window.addEventListener('DOMContentLoaded', () => {
      renderCheerComments();
    });

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
